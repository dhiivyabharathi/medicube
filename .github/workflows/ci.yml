name: Medicube CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: medicube-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CI: true
  MEDICUBE_API_URL: http://localhost:3001
  MEDICUBE_PUBLISH: '1'

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            qa-dashboard/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install QA dashboard dependencies
        working-directory: qa-dashboard
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build healthcare frontend
        working-directory: frontend
        run: npm run build

      - name: Build QA dashboard
        working-directory: qa-dashboard
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      - name: Upload QA dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: qa-dashboard-dist
          path: qa-dashboard/dist/
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            automation/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: automation
        run: npx playwright test
        env:
          CI: true
          MEDICUBE_API_URL: ${{ env.MEDICUBE_API_URL }}
          MEDICUBE_PUBLISH: ${{ env.MEDICUBE_PUBLISH }}

      - name: Write job summary
        if: always()
        working-directory: automation
        run: node scripts/ci-summary.mjs test-results/results.json

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automation/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-json
          path: |
            automation/test-results/results.json
            automation/test-results/.last-run.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-artifacts
          path: |
            automation/test-results/**
            !automation/test-results/results.json
          if-no-files-found: ignore
          retention-days: 7
